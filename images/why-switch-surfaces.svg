<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="'Segoe UI', sans-serif">
  <rect width="960" height="540" fill="#1e1e1e"/>
  <text x="480" y="55" fill="#cccccc" font-size="20" text-anchor="middle" font-weight="600">Switch freely between surfaces</text>
  <!-- Agents window -->
  <g>
    <rect x="60" y="90" width="360" height="380" rx="6" fill="#1e1e1e" stroke="#3794ff" stroke-width="2"/>
    <rect x="60" y="90" width="360" height="28" rx="6" fill="#323233"/>
    <text x="240" y="109" fill="#3794ff" font-size="13" text-anchor="middle" font-weight="600">Agents window</text>
    <rect x="60" y="118" width="44" height="352" fill="#333333"/>
    <rect x="104" y="118" width="150" height="352" fill="#252526"/>
    <text x="116" y="142" fill="#cccccc" font-size="11">SESSIONS</text>
    <rect x="116" y="154" width="126" height="20" rx="4" fill="#094771"/>
    <rect x="116" y="182" width="126" height="20" rx="4" fill="#2a2a2e"/>
    <rect x="116" y="210" width="126" height="20" rx="4" fill="#2a2a2e"/>
    <rect x="254" y="118" width="166" height="352" fill="#1e1e1e"/>
    <rect x="268" y="150" width="140" height="11" rx="3" fill="#2d2d30"/>
    <rect x="268" y="170" width="120" height="11" rx="3" fill="#2d2d30"/>
  </g>
  <!-- Chat view -->
  <g>
    <rect x="540" y="90" width="360" height="380" rx="6" fill="#1e1e1e" stroke="#3c3c3c"/>
    <rect x="540" y="90" width="360" height="28" rx="6" fill="#323233"/>
    <text x="720" y="109" fill="#cccccc" font-size="13" text-anchor="middle">Chat view</text>
    <rect x="540" y="118" width="360" height="352" fill="#1e1e1e"/>
    <rect x="560" y="150" width="320" height="40" rx="6" fill="#252526"/>
    <text x="576" y="175" fill="#cccccc" font-size="13">Add a dark-mode toggle to settings</text>
    <rect x="560" y="205" width="300" height="11" rx="3" fill="#2d2d30"/>
    <rect x="560" y="224" width="260" height="11" rx="3" fill="#2d2d30"/>
    <rect x="560" y="243" width="280" height="11" rx="3" fill="#2d2d30"/>
  </g>
  <!-- arrow -->
  <line x1="430" y1="280" x2="525" y2="280" stroke="#3794ff" stroke-width="3"/>
  <path d="M520 272 l12 8 l-12 8 z" fill="#3794ff"/>
  <text x="480" y="320" fill="#858585" font-size="12" text-anchor="middle">shared sessions / settings / keybindings</text>
</svg>
